<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Collage 📸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <main class="page-shell">
    <div class="topbar">
      <a class="back" href="index.html">← Back Home</a>
      <h1>Our Cute Collage <span class="sticker">💘📷✨</span></h1>
    </div>

    <section class="panel">
      <p>Replace these with your own photos if you want — layout is already collage-style with cute stickers.</p>
      <div class="collage">
        <figure class="photo c1" style="--tilt:-3deg"><img src="https://images.unsplash.com/photo-1516589091380-5d8e87df6992?auto=format&fit=crop&w=700&q=80" alt="couple memory"><span>🌸 us</span></figure>
        <figure class="photo c2" style="--tilt:2deg"><img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=900&q=80" alt="holding hands"><span>🫶 forever</span></figure>
        <figure class="photo c3" style="--tilt:-2deg"><img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=500&q=80" alt="flowers date"><span>💐 date day</span></figure>
        <figure class="photo c4" style="--tilt:1deg"><img src="https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=900&q=80" alt="romantic memory"><span>🐻 sweet</span></figure>
        <figure class="photo c5" style="--tilt:-1deg"><img src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=900&q=80" alt="smiling together"><span>💝 mine</span></figure>
      </div>
    </section>
  </main>
</body>
</html>
